<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native NZ Birds</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Native Birds of New Zealand</h1>
        <p>Discover our unique avian species of Aotearoa</p>
    </header>

    <div class="container">
        <aside class="sidebar">
            <input id="search" type="text" placeholder="Search" aria-label="Search" onkeyup="searchBirds()">
            <button onclick="sortBy('name')">Sort by Name</button>
            <button onclick="sortBy('status')">Sort by Status</button>
        </aside>

        <main>
            <div id="bird_grid" class="grid_container"></div>
        </main>
    </div>

    <script src="script.js"></script>

    <footer>
        Credit: https://www.birdsnz.org.nz/
    </footer>

</body>

</html>
