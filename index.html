<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native NZ Birds</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data/images/favicon.ico" type="image/x-icon">
</head>

<body>

    <header>
        <h1>Native Birds of New Zealand</h1>
        <p>Discover our unique avian species of Aotearoa</p>
    </header>

    <div class="container">
        <aside class="sidebar">
            <!-- Searching function - need to add asc & desc -->`
            <div class="filter-box">
                <p>Search:</p>
                <input id="search" type="text" placeholder="Search" aria-label="Search">
                <p>Sort by:</p>
                <select id="sortByBox">
                    <option value="name">Name</option>
                    <option value="status">Status</option>
                    <option value="weight">Weight</option>
                    <option value="length">Length</option>
                    <option value="scientificName">Scientific Name</option>
                    <option value="orderName">Order</option>
                    <option value="familyName">Family</option>
                </select>
                <p>Order:</p>
                <select id="orderByBox">
                    <option value="ascending">Ascending</option>
                    <option value="descending">Descending</option>
                </select>
                <button onclick="applyFilter()">Apply Filter</button>
                <p id="searchCount"></p>
            </div>
            <div id="status-legend"></div>
        </aside>

        <main>
            <div id="bird_grid" class="grid_container"></div>
        </main>
    </div>

    <script src="script.js"></script>

    <footer>
        Data sourced from <a href="https://www.birdsnz.org.nz/" target="_blank">Birds New Zealand</a> for educational purposes.
    </footer>

</body>

</html>
