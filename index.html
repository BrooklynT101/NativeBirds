<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native NZ Birds</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Native Birds of New Zealand</h1>
        <p>Discover our unique avian species of Aotearoa</p>
    </header>

    <div class="container">
        <aside class="sidebar">
            <!-- Searching function - need to add asc & desc -->
            <input id="search" type="text" placeholder="Search" aria-label="Search" onkeyup="searchBirds()">
            <!-- <button onclick="sortBy('name')">Sort by Name</button>
            <button onclick="sortBy('status')">Sort by Status</button>
            <button onclick="sortBy('weight')">Sort by Weight</button>
            <button onclick="sortBy('length')">Sort by Length</button> -->
            <p>Sort by:
                <select id="sortByBox" onchange="sortBy()">
                    <option value="name">Name</option>
                    <option value="status">Status</option>
                    <option value="weight">Weight</option>
                    <option value="length">Length</option>
                </select>
            </p>
            <div id="status-legend"></div>
        </aside>

        <main>
            <div id="bird_grid" class="grid_container"></div>
        </main>
    </div>

    <script src="script.js"></script>

    <footer>
        Credit: https://www.birdsnz.org.nz/
    </footer>

</body>

</html>
